[package]
name = "db-test"
version = "0.1.0"
edition = "2021"

[dependencies]
rocksdb = "0.22.0"
sled = "0.34"
rand = "0.8"
tempfile = "3.8"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
rayon = "1.8"

[[bin]]
name = "db_bench"
path = "src/main.rs"

